<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tài Sản Số Tự Động</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        .box { max-width: 400px; margin: 0 auto; background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; box-sizing: border-box; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; line-height: 1.5; }
        .btn-substack { display: block; background: #ff5400; color: #fff; text-decoration: none; padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 20px; font-size: 16px; text-transform: uppercase; }
        .btn-momo { display: block; background: #a50064; color: #fff; text-decoration: none; padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 20px; font-size: 16px; text-transform: uppercase; }
        .price { font-size: 22px; color: #00ff66; font-weight: bold; margin-top: 25px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>HỆ THỐNG TÀI SẢN SỐ</h1>
        <p>Giải pháp tối giản hóa quy trình vận hành và tạo lập dòng tiền tự động 100%.</p>
        
        <!-- BƯỚC 1: ĐĂNG KÝ EMAIL SUBSTACK -->
        <a href="https://substack.com" target="_blank" class="btn-substack">BƯỚC 1: ĐĂNG KÝ EMAIL NHẬN FILE</a>
        
        <p class="price">GIÁ SỞ HỮU: 199.000 Đ</p>
        
        <!-- BƯỚC 2: LINK REDIRECT ĐẾN VÍ MOMO CỦA LÊ TRẦN THẢO NGUYÊN -->
        <a href="https://momo.vn" target="_blank" class="btn-momo">BƯỚC 2: BẤM ĐỂ THANH TOÁN MOMO</a>
        
        <p style="font-size:12px; color:#666; margin-top:25px;">Lưu ý: Hệ thống tự động gửi file qua Email Substack sau 1 phút xác nhận.</p>
    </div>
</body>
</html>
