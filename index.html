<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tài Sản Số Tự Động</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; text-align: center; padding: 40px 20px; }
        .box { max-width: 400px; margin: 0 auto; background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; line-height: 1.5; }
        iframe { width: 100%; height: 80px; border: none; margin-top: 20px; }
        .btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>HỆ THỐNG TÀI SẢN SỐ</h1>
        <p>Giải pháp tối giản hóa quy trình vận hành và tạo lập dòng tiền tự động 100%.</p>
        
        <!-- Thay Substack_URL bằng link Substack của bạn ở bước sau -->
        <iframe src="https://YOUR_://substack.com" frameborder="0" scrolling="no"></iframe>
        
        <!-- Thay LINK_THANH_TOAN bằng link Stripe/PayPal của bạn ở bước sau -->
        <a href="LINK_THANH_TOAN" class="btn">MUA NGAY - TẢI TỰ ĐỘNG</a>
    </div>
</body>
</html>
