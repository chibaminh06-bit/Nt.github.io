<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tài Sản Số Tự Động</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        .box { max-width: 400px; margin: 0 auto; background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; box-sizing: border-box; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; line-height: 1.5; }
        .btn-link { display: block; background: #ff5400; color: #fff; text-decoration: none; padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 20px; font-size: 16px; }
        .qr-box { margin-top: 25px; background: #fff; padding: 15px; border-radius: 8px; display: inline-block; }
        .qr-box img { width: 220px; height: 220px; display: block; margin: 0 auto; border: none; }
        .price { font-size: 20px; color: #00ff66; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>HỆ THỐNG TÀI SẢN SỐ</h1>
        <p>Giải pháp tối giản hóa quy trình vận hành và tạo lập dòng tiền tự động 100%.</p>
        
        <!-- BƯỚC 1: ĐƯỜNG SANG SUBSTACK ĐỂ KHÁCH ĐIỀN EMAIL -->
        <a href="https://substack.com" target="_blank" class="btn-link">BƯỚC 1: ĐĂNG KÝ EMAIL NHẬN FILE</a>
        
        <p class="price">GIÁ SỞ HỮU: 199.000 Đ</p>
        
        <!-- BƯỚC 2: MÃ QR MOMO ĐÃ KHÓA CỨNG LINK CHUYỂN KHOẢN CỦA BẠN -->
        <div class="qr-box">
            <p style="color:#000; font-weight:bold; margin-top:0; font-size:14px; margin-bottom:10px;">BƯỚC 2: QUÉT MÃ CHUYỂN KHOẢN</p>
            <img src="https://quickchart.io" alt="Thanh Toan MoMo">
        </div>
        <p style="font-size:12px; color:#666; margin-top:15px;">Lưu ý: Hệ thống tự động gửi file qua Email Substack sau 1 phút.</p>
    </div>
</body>
</html>
